name: Python CI Pipeline

# Akkor fut le, amikor kódot töltesz fel a main ágra
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  teszteles:
    runs-on: ubuntu-latest # Egy friss Linux gépet indít el a felhőben

    steps:
    - name: Kód letöltése a repóból
      uses: actions/checkout@v4

    - name: Python környezet beállítása
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Függőségek telepítése
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Automata teszt futtatása
      run: |
        pytest test_main.py